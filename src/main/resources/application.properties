server.port=8080

# ===================================================================
# DEFAULT DATABASE: H2 In-Memory (Zero configuration required)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# MYSQL INSTRUCTIONS:
# To switch to MySQL, activate the 'mysql' profile:
# In this file set: spring.profiles.active=mysql
# And configure your password in application-mysql.properties
# ===================================================================
